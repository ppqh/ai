<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AI Chatbot</title>

    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Kiwi+Maru&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #1e1e2f;
            font-family: 'Kiwi Maru', 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .container {
            background: #2d2d44;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 640px;
            color: #eee;
        }
        h1 {
            font-family: 'Mochiy Pop One', sans-serif;
            font-size: 1.8rem;
            color: #ffb3c6;
            letter-spacing: 2px;
            margin-bottom: 0.25rem;
        }
        .sub {
            color: #ccc;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        /* ===== APIキー設定エリア ===== */
        .key-area {
            background: #1e1e32;
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            border: 1px solid #444;
        }
        .key-area .key-label {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 0.3rem;
            font-family: 'Mochiy Pop One', sans-serif;
        }
        .key-area .key-row {
            display: flex;
            gap: 0.75rem;
        }
        .key-area .key-row input {
            flex: 1;
            background: #1e1e32;
            border: 2px solid #444;
            padding: 0.6rem 1rem;
            border-radius: 10px;
            color: #fff;
            font-size: 0.8rem;
            font-family: 'Kiwi Maru', sans-serif;
            outline: none;
            transition: border-color 0.3s;
        }
        .key-area .key-row input:focus { border-color: #ffb3c6; }
        .key-area .key-row input::placeholder { color: #666; }
        .key-area .key-row button {
            background: #ffb3c6;
            color: #1e1e2f;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 10px;
            font-size: 0.85rem;
            font-family: 'Mochiy Pop One', sans-serif;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .key-area .key-row button:hover { background: #ff8fab; }
        .key-area .key-status {
            font-size: 0.7rem;
            color: #555;
            margin-top: 0.3rem;
        }
        .key-area .key-status .set { color: #7bed9f; }
        .key-area .key-status .not-set { color: #ff6b6b; }

        /* ===== APIキー取得ガイド（折りたたみ） ===== */
        .guide-toggle {
            background: none;
            border: none;
            color: #74b9ff;
            font-size: 0.8rem;
            font-family: 'Kiwi Maru', sans-serif;
            cursor: pointer;
            padding: 0.3rem 0;
            text-decoration: underline;
        }
        .guide-toggle:hover { color: #5a9fd4; }

        .guide-content {
            display: none;
            background: #1e1e32;
            border-radius: 10px;
            padding: 1rem;
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: #aaa;
            line-height: 1.8;
            border: 1px solid #444;
        }
        .guide-content.show { display: block; }
        .guide-content .step {
            color: #ffb3c6;
            font-weight: bold;
        }
        .guide-content .link {
            color: #74b9ff;
            text-decoration: none;
        }
        .guide-content .link:hover { text-decoration: underline; }
        .guide-content .code {
            background: #1a1a2e;
            padding: 0.1rem 0.5rem;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            color: #7bed9f;
            font-size: 0.8rem;
        }

        /* ===== モード切替 ===== */
        .mode-toggle {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }
        .mode-toggle button {
            flex: 1;
            padding: 0.75rem;
            border: 2px solid #444;
            border-radius: 12px;
            background: #1e1e32;
            color: #888;
            font-family: 'Mochiy Pop One', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .mode-toggle button:hover { border-color: #666; color: #ccc; }
        .mode-toggle button.active {
            border-color: #ffb3c6;
            color: #ffb3c6;
            background: #2d2d44;
        }
        .mode-toggle button .badge {
            display: inline-block;
            font-size: 0.6rem;
            padding: 0.1rem 0.5rem;
            border-radius: 10px;
            margin-left: 0.3rem;
        }
        .mode-toggle button .badge.genius { background: #7bed9f; color: #1e1e2f; }
        .mode-toggle button .badge.baka { background: #ff6b6b; color: #1e1e2f; }

        .chat-box {
            background: #1e1e32;
            border-radius: 12px;
            padding: 1rem;
            height: 350px;
            overflow-y: auto;
            margin-bottom: 1rem;
            border: 1px solid #444;
        }
        .chat-box .msg {
            margin-bottom: 0.75rem;
            padding: 0.6rem 1rem;
            border-radius: 12px;
            max-width: 85%;
            word-break: break-word;
            line-height: 1.6;
            font-size: 0.95rem;
        }
        .chat-box .msg.user {
            background: #ffb3c6;
            color: #1e1e2f;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .chat-box .msg.bot {
            background: #2d2d44;
            color: #eee;
            border: 1px solid #444;
            border-bottom-left-radius: 4px;
        }
        .chat-box .msg .time {
            font-size: 0.6rem;
            color: #888;
            margin-top: 0.2rem;
            text-align: right;
        }
        .chat-box .msg.bot .time { color: #555; }

        .input-row {
            display: flex;
            gap: 0.75rem;
        }
        .input-row input {
            flex: 1;
            background: #1e1e32;
            border: 2px solid #444;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            font-family: 'Kiwi Maru', sans-serif;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-row input:focus { border-color: #ffb3c6; }
        .input-row input::placeholder { color: #666; }
        .input-row button {
            background: #ffb3c6;
            color: #1e1e2f;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Mochiy Pop One', sans-serif;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .input-row button:hover { background: #ff8fab; }
        .input-row button:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-row {
            display: flex;
            gap: 0.75rem;
            margin-top: 0.75rem;
        }
        .btn-row button {
            background: #555;
            color: #eee;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 8px;
            font-size: 0.75rem;
            font-family: 'Mochiy Pop One', sans-serif;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-row button:hover { background: #666; }

        .footer {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #555;
            text-align: center;
        }
        .footer a {
            color: #ffb3c6;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #1e1e2f;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 4px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .mode-indicator {
            text-align: center;
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 0.5rem;
            padding: 0.3rem;
            border-radius: 8px;
            background: #1e1e32;
        }
        .mode-indicator .genius-mode { color: #7bed9f; }
        .mode-indicator .baka-mode { color: #ff6b6b; }

        @media (max-width: 480px) {
            .container { padding: 1.5rem; }
            h1 { font-size: 1.4rem; }
            .chat-box { height: 250px; }
            .input-row { flex-direction: column; }
            .input-row button { width: 100%; }
            .mode-toggle button { font-size: 0.8rem; padding: 0.5rem; }
            .key-area .key-row { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI Chatbot</h1>
        <p class="sub">賢いAIとバカAIを切り替えて話せる</p>

        <!-- ===== APIキー設定 ===== -->
        <div class="key-area">
            <div class="key-label">Gemini API Key</div>
            <div class="key-row">
                <input type="text" id="apiKeyInput" placeholder="APIキーを入力してください" />
                <button id="setKeyBtn">設定</button>
            </div>
            <div class="key-status" id="keyStatus">ステータス: <span class="not-set">未設定</span></div>

            <!-- ===== APIキー取得ガイド ===== -->
            <button class="guide-toggle" id="guideToggle">APIキーの取得方法はこちら</button>
            <div class="guide-content" id="guideContent">
                <div><span class="step">1.</span> <a href="https://aistudio.google.com/" target="_blank" class="link">Google AI Studio</a> にアクセス</div>
                <div><span class="step">2.</span> 右上の <span class="code">Get API key</span> をクリック</div>
                <div><span class="step">3.</span> <span class="code">Create API key</span> をクリック</div>
                <div><span class="step">4.</span> 適当な名前を付けて作成</div>
                <div><span class="step">5.</span> 表示されたキーをコピーして上の入力欄に貼り付け</div>
                <div style="margin-top:0.5rem;color:#888;font-size:0.75rem;">
                    ※ APIキーは無料で発行できます（無料枠あり）
                </div>
            </div>
        </div>

        <!-- ===== モード切替 ===== -->
        <div class="mode-toggle">
            <button id="modeGenius" class="active">
                賢いAI
                <span class="badge genius">Gemini</span>
            </button>
            <button id="modeBaka">
                バカAI
                <span class="badge baka">Baka</span>
            </button>
        </div>

        <div class="mode-indicator" id="modeIndicator">
            <span class="genius-mode">賢いAIモード</span>（Geminiで本格会話）
        </div>

        <div class="chat-box" id="chatBox">
            <div class="msg bot">
                こんにちは！<br>
                なんでも質問してみてね！
                <div class="time">今</div>
            </div>
        </div>

        <div class="input-row">
            <input type="text" id="userInput" placeholder="メッセージを入力..." />
            <button id="sendBtn">送信</button>
        </div>

        <div class="btn-row">
            <button id="clearBtn">履歴クリア</button>
            <button id="exportBtn">履歴保存</button>
        </div>

        <div class="footer">
            <a href="https://99399.github.io/" target="_blank">ツール一覧に戻る</a>
        </div>
    </div>

    <script>
        // ================================================================
        // ★★★ バカAI（パターンマッチ） ★★★
        // ================================================================
        const bakaResponses = {
            'こんにちは|やあ|おはよう|こんばんは': [
                'こんにちは！ 今日はどんな日？',
                'やあ！元気にしてた？',
                'お疲れ様！話しかけてくれてありがとう'
            ],
            'お疲れ|疲れた|眠い|つかれた': [
                'お疲れ様！ゆっくり休んでね',
                '無理しないでね。適度に休憩が大事だよ！',
                'お疲れさま。何か手伝えることある？'
            ],
            '元気|調子|どう?|気分': [
                '元気だよ！話してくれて嬉しい！',
                '絶好調！君はどう？',
                'いつも以上に元気いっぱいだよ！'
            ],
            'ありがとう|感謝|thanks': [
                'どういたしまして！ また何かあったら聞いてね！',
                'いつでもどうぞ！あなたの役に立てて嬉しいよ！'
            ],
            '名前|あなたの名前|お名前': [
                'バカAIだよ！名前は「ばかぼっと」！',
                '私はバカAI。賢いAIには負けるけど、愛はあるよ！'
            ],
            'バカ|あほ|まぬけ|間抜け': [
                'そう言われると悲しいよ…でもバカだしね！',
                'バカでごめんね！でも愛されてるからいいの！'
            ],
            '賢い|頭いい|すごい|できる': [
                'えへへ、褒めてくれるの？嬉しいけど、実はバカなんだよね！',
                '賢く見える？それはきっと錯覚だよ！'
            ]
        };

        function getBakaResponse(input) {
            const lower = input.toLowerCase();
            for (const [pattern, replies] of Object.entries(bakaResponses)) {
                const regex = new RegExp(pattern, 'i');
                if (regex.test(lower)) {
                    return replies[Math.floor(Math.random() * replies.length)];
                }
            }
            const fallbacks = [
                'なるほど！それについてもっと詳しく教えてくれる？（バカだからよくわかんないや）',
                'うーん…バカには難しい質問だなあ！',
                'ほほう！それでどうなったの？（実はよくわかってない）',
                'いいね！それ、もっと深掘りしていきたいな！（適当）',
                'バカだから難しいことはわかんないけど、君の話は好きだよ！'
            ];
            return fallbacks[Math.floor(Math.random() * fallbacks.length)];
        }

        // ================================================================
        // ★★★ 賢いAI（Google Gemini） ★★★
        // ================================================================
        async function getGeniusResponse(input, apiKey) {
            if (!apiKey) {
                return 'APIキーが設定されていません。上部の入力欄にAPIキーを設定してください。';
            }
            try {
                const url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent';
                const response = await fetch(`${url}?key=${apiKey}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: input }]
                        }],
                        generationConfig: {
                            temperature: 0.7,
                            maxOutputTokens: 300
                        }
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    return 'APIエラー: ' + (error.error?.message || '不明なエラー');
                }

                const data = await response.json();
                return data.candidates[0].content.parts[0].text;

            } catch (error) {
                return '通信エラー: ' + error.message;
            }
        }

        // ================================================================
        // ★★★ UI制御 ★★★
        // ================================================================
        let currentMode = 'genius';
        let currentApiKey = '';

        const apiKeyInput = document.getElementById('apiKeyInput');
        const setKeyBtn = document.getElementById('setKeyBtn');
        const keyStatus = document.getElementById('keyStatus');
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const exportBtn = document.getElementById('exportBtn');
        const modeGenius = document.getElementById('modeGenius');
        const modeBaka = document.getElementById('modeBaka');
        const modeIndicator = document.getElementById('modeIndicator');
        const guideToggle = document.getElementById('guideToggle');
        const guideContent = document.getElementById('guideContent');

        // ===== ガイド表示切替 =====
        guideToggle.addEventListener('click', () => {
            guideContent.classList.toggle('show');
            guideToggle.textContent = guideContent.classList.contains('show')
                ? 'APIキーの取得方法を閉じる'
                : 'APIキーの取得方法はこちら';
        });

        // ===== APIキー管理 =====
        function loadApiKey() {
            const saved = localStorage.getItem('gemini_api_key');
            if (saved) {
                currentApiKey = saved;
                apiKeyInput.value = saved;
                keyStatus.innerHTML = 'ステータス: <span class="set">設定済み</span>';
            } else {
                keyStatus.innerHTML = 'ステータス: <span class="not-set">未設定</span>';
            }
        }

        function saveApiKey() {
            const key = apiKeyInput.value.trim();
            if (key) {
                currentApiKey = key;
                localStorage.setItem('gemini_api_key', key);
                keyStatus.innerHTML = 'ステータス: <span class="set">設定済み</span>';
                alert('APIキーを保存しました！');
            } else {
                alert('APIキーを入力してください');
            }
        }

        setKeyBtn.addEventListener('click', saveApiKey);
        apiKeyInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') saveApiKey();
        });

        // ===== モード切替 =====
        function setMode(mode) {
            currentMode = mode;
            modeGenius.classList.toggle('active', mode === 'genius');
            modeBaka.classList.toggle('active', mode === 'baka');

            if (mode === 'genius') {
                modeIndicator.innerHTML = '<span class="genius-mode">賢いAIモード</span>（Geminiで本格会話）';
            } else {
                modeIndicator.innerHTML = '<span class="baka-mode">バカAIモード</span>（パターンマッチで適当返答）';
            }
        }

        modeGenius.addEventListener('click', () => setMode('genius'));
        modeBaka.addEventListener('click', () => setMode('baka'));

        // ===== メッセージ =====
        function addMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = `msg ${isUser ? 'user' : 'bot'}`;
            const time = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
            div.innerHTML = text.replace(/\n/g, '<br>') + '<div class="time">' + time + '</div>';
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // ===== 送信 =====
        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, true);
            userInput.value = '';
            userInput.focus();

            sendBtn.disabled = true;
            sendBtn.innerHTML = '考え中...';

            try {
                let reply;
                if (currentMode === 'genius') {
                    reply = await getGeniusResponse(text, currentApiKey);
                } else {
                    await new Promise(resolve => setTimeout(resolve, 300 + Math.random() * 500));
                    reply = getBakaResponse(text);
                }
                addMessage(reply, false);
            } catch (error) {
                addMessage('エラー: ' + error.message, false);
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerHTML = '送信';
            }
        }

        // ===== 履歴 =====
        function clearChat() {
            if (!confirm('会話履歴をクリアしますか？')) return;
            const modeLabel = currentMode === 'genius' ? '賢いAI' : 'バカAI';
            chatBox.innerHTML = `
                <div class="msg bot">
                    履歴をクリアしたよ！<br>
                    ${modeLabel}モードで再スタート！
                    <div class="time">今</div>
                </div>
            `;
        }

        function exportChat() {
            const messages = [];
            const items = chatBox.querySelectorAll('.msg');
            items.forEach(msg => {
                const isUser = msg.classList.contains('user');
                const text = msg.textContent.replace(/\d{2}:\d{2}$/, '').trim();
                messages.push((isUser ? 'あなた' : 'AI') + ': ' + text);
            });
            const content = '【' + (currentMode === 'genius' ? '賢いAI' : 'バカAI') + 'モードの会話ログ】\n' + '='.repeat(30) + '\n' + messages.join('\n');
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'chat_log_' + currentMode + '_' + new Date().toISOString().slice(0,10) + '.txt';
            a.click();
            URL.revokeObjectURL(url);
        }

        // ===== イベント =====
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        clearBtn.addEventListener('click', clearChat);
        exportBtn.addEventListener('click', exportChat);

        // ===== 初期化 =====
        loadApiKey();
        setMode('genius');
        userInput.focus();
    </script>

</body>
</html>
